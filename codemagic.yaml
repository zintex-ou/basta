workflows:
  ios-testflight:
    name: Basta → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Zintex OU"
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.zintex.basta"
        XCODE_SCHEME: "Basta"
        APP_STORE_APPLE_ID: "6824057805"
      ios_signing:
        provisioning_profiles:
          - basta_app
          - basta_monitor
          - basta_shield
          - basta_report
        certificates:
          - Resetbet Dis
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Apply signing to all targets
        script: xcode-project use-profiles
      - name: Bump build number
        script: |
          LAST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          BUILD=$((LAST + 1))
          agvtool new-version -all "$BUILD"
      - name: Build IPA
        script: xcode-project build-ipa --project "Basta.xcodeproj" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
